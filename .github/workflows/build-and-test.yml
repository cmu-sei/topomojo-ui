name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/npm-test.yaml@npm-test-v1
    permissions:
      contents: read
    with:
      # Match the major version of the node image in this repo's Dockerfile.
      node-version: "24"
      # Builds only for now: most specs fail on main, so CI doesn't run them yet. These are the
      # Dockerfile's two production builds, so a pull request catches a broken production build.
      test-command: npx ng build topomojo-work -c production && npx ng build topomojo-launchpoint --base-href=/lp/ -c production
      coverage-path: ""

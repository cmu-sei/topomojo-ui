version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Angular packages move together. A dependency goes to the group whose
      # pattern matches it most specifically, and a group with no patterns
      # outranks every wildcard, so minor-and-patch needs its own "*" to let
      # "@angular*" win.
      angular:
        patterns: ["@angular*", "zone.js"]
        update-types: [minor, patch]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Angular and TypeScript majors need `ng update` migrations; do them by hand.
      - dependency-name: "@angular*"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Angular 21 and ngx-markdown 21 need zone.js ~0.15 or ~0.16; drop with the next Angular upgrade.
      - dependency-name: zone.js
        versions: [">= 0.17.0"]
      # ngx-markdown 21 needs marked 17 or 18 and emoji-toolkit < 11 (marked-smartypants needs marked < 19).
      - dependency-name: marked
        versions: [">= 19.0.0"]
      - dependency-name: emoji-toolkit
        versions: [">= 11.0.0"]
      # @cmusei/console-forge 0.22 needs @novnc/novnc >=1.4.0 <1.6.0 (a peer dependency).
      - dependency-name: "@novnc/novnc"
        versions: [">= 1.6.0"]
      # @types/node follows the Node major the app runs on (the Dockerfile's node image); move it by hand with Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
    ignore:
      # Node majors are moved by hand, together with CI's node-version, onto even-numbered (LTS) releases only.
      - dependency-name: node
        update-types: [version-update:semver-major]
